name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases for v* tags

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT: TypstPreview.xcodeproj
      SCHEME: TypstPreview
      BUNDLE_ID_PREFIX: ${{ vars.BUNDLE_ID_PREFIX || 'com.example' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Determine version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "MARKETING_VERSION=${VERSION%%-*}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          xcodebuild -version

      # Sign + notarize only on pushes/tags/manual runs, and only when the secrets exist
      # (pull requests, especially from forks, get an unsigned build).
      - name: Decide whether to sign
        id: signing
        env:
          CERT: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
        run: |
          if [[ -n "$CERT" && -n "$APPLE_TEAM_ID" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Building unsigned (no signing secrets or pull request)."
          fi

      # ---------------------------------------------------------------- unsigned
      - name: Build (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            BUNDLE_ID_PREFIX="$BUNDLE_ID_PREFIX" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build | tee "$RUNNER_TEMP/xcodebuild.log"
          echo "APP_PATH=$RUNNER_TEMP/dd/Build/Products/Release/TypstPreview.app" >> "$GITHUB_ENV"
          echo "ZIP_NAME=TypstPreview-$VERSION-unsigned.zip" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- signed
      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive (Developer ID)
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -o pipefail
          ARCHIVE="$RUNNER_TEMP/TypstPreview.xcarchive"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -archivePath "$ARCHIVE" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN --timestamp" \
            BUNDLE_ID_PREFIX="$BUNDLE_ID_PREFIX" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tee "$RUNNER_TEMP/xcodebuild.log"
          echo "APP_PATH=$ARCHIVE/Products/Applications/TypstPreview.app" >> "$GITHUB_ENV"
          echo "ZIP_NAME=TypstPreview-$VERSION.zip" >> "$GITHUB_ENV"

      - name: Verify signature
        if: steps.signing.outputs.enabled == 'true'
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          for bundle in "$APP_PATH" \
                        "$APP_PATH/Contents/PlugIns/TypstQuickLook.appex" \
                        "$APP_PATH/Contents/PlugIns/TypstQuickLook.appex/Contents/XPCServices/TypstRenderService.xpc"; do
            echo "== $bundle"
            codesign -dvv "$bundle" 2>&1 | grep -E "Authority=Developer ID|TeamIdentifier|Timestamp|flags"
            if codesign -d --entitlements - --xml "$bundle" 2>/dev/null | grep -q "get-task-allow"; then
              echo "::error::$bundle contains get-task-allow; notarization would fail"; exit 1
            fi
          done

      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$NOTARY_KEY" > "$KEY_FILE"
          AUTH=(--key "$KEY_FILE" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")

          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${AUTH[@]}" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"

          STATUS=$(jq -r .status "$RUNNER_TEMP/notary.json")
          SUBMISSION_ID=$(jq -r .id "$RUNNER_TEMP/notary.json")
          if [[ "$STATUS" != "Accepted" ]]; then
            echo "::error::Notarization status: $STATUS"
            xcrun notarytool log "$SUBMISSION_ID" "${AUTH[@]}" || true
            rm -f "$KEY_FILE"
            exit 1
          fi
          rm -f "$KEY_FILE"

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      # ---------------------------------------------------------------- output
      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/$ZIP_NAME"
          shasum -a 256 "dist/$ZIP_NAME" | tee "dist/$ZIP_NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Typst Preview $VERSION" --generate-notes

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore

      - name: Clean up keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN:-}" ]]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
